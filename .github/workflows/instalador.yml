# Compila a mesa e gera o instalador no proprio GitHub.
# Os SDKs vem de Secrets (ASIO_SDK_URL / NDI_SDK_URL) porque Steinberg e
# NewTek permitem usar, nao redistribuir - e repo publico e redistribuicao.
# Sem os Secrets o .exe sai marcado NAO-USAR-NO-AR.

name: Instalador

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A suite primeiro: nao usa JUCE nem SDK, compila em segundos.
      # Um defeito no nucleo para o workflow antes dos 15 min de JUCE.
      - name: Suite do nucleo
        shell: pwsh
        run: |
          cmake -B build-testes -S . -DBUILD_APP=OFF
          cmake --build build-testes --config Release
          $exe = Get-ChildItem build-testes -Recurse -Filter test_core.exe |
                 Select-Object -First 1 -ExpandProperty FullName
          $saida = & $exe
          $saida | Select-Object -Last 3
          $casos  = ($saida | Select-String '^\[').Count
          $falhas = ($saida | Select-String '^\[FALHA\]').Count
          Write-Host "::notice::$casos casos, $falhas falhas"
          if ($falhas -gt 0) { exit 1 }

      - name: Versao
        id: versao
        shell: pwsh
        run: |
          $vh = Get-Content Source/Core/Version.h -Raw
          $v = [regex]::Match($vh, 'kVersion\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $v) { Write-Host "::error::Nao achei kVersion"; exit 1 }
          "versao=$v" >> $env:GITHUB_OUTPUT
          Write-Host "::notice::Versao $v"

      - name: ASIO SDK
        id: asio
        shell: pwsh
        env:
          URL: ${{ secrets.ASIO_SDK_URL }}
        run: |
          if (-not $env:URL) {
            Write-Host "::warning::Sem ASIO_SDK_URL - instalador SEM ASIO"
            "tem=nao" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Invoke-WebRequest $env:URL -OutFile asio.zip
          Expand-Archive asio.zip -DestinationPath C:\SDKs\tmp -Force
          $raiz = Get-ChildItem C:\SDKs\tmp -Directory -Recurse |
                  Where-Object { Test-Path "$($_.FullName)\common\iasiodrv.h" } |
                  Select-Object -First 1
          if (-not $raiz) { Write-Host "::error::zip sem common\iasiodrv.h"; exit 1 }
          Move-Item $raiz.FullName C:\SDKs\asiosdk -Force
          "tem=sim" >> $env:GITHUB_OUTPUT

      - name: NDI SDK
        id: ndi
        shell: pwsh
        env:
          URL: ${{ secrets.NDI_SDK_URL }}
        run: |
          if (-not $env:URL) {
            Write-Host "::warning::Sem NDI_SDK_URL - instalador SEM NDI"
            "tem=nao" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Invoke-WebRequest $env:URL -OutFile ndi.zip
          Expand-Archive ndi.zip -DestinationPath C:\NDI\tmp -Force
          $raiz = Get-ChildItem C:\NDI\tmp -Directory -Recurse |
                  Where-Object { Test-Path "$($_.FullName)\Include\Processing.NDI.Lib.h" } |
                  Select-Object -First 1
          if (-not $raiz) { Write-Host "::error::zip sem Include\Processing.NDI.Lib.h"; exit 1 }
          Move-Item $raiz.FullName C:\NDI\SDK -Force
          "tem=sim" >> $env:GITHUB_OUTPUT

      - name: Cache do JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Compilar em Release
        shell: pwsh
        run: |
          $cfg = @("-B","build","-S",".")
          if ("${{ steps.asio.outputs.tem }}" -eq "sim") { $cfg += '-DASIO_SDK_DIR=C:/SDKs/asiosdk' }
          if ("${{ steps.ndi.outputs.tem }}"  -eq "sim") { $cfg += '-DNDI_SDK_DIR=C:/NDI/SDK' }
          cmake @cfg
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Gerar o instalador
        shell: pwsh
        run: |
          $exe = "build/MesaConsole_artefacts/Release/Mesa Console.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::Nao achei $exe"; exit 1 }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = "${{ steps.versao.outputs.versao }}"
          & $iscc "/DMyAppVersion=$v" "/DMySourceExe=$((Resolve-Path $exe).Path)" "instalador\MesaConsole.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $faltas = @()
          if ("${{ steps.asio.outputs.tem }}" -ne "sim") { $faltas += "SEM-ASIO" }
          if ("${{ steps.ndi.outputs.tem }}"  -ne "sim") { $faltas += "SEM-NDI"  }
          if ($faltas.Count -gt 0) {
            Move-Item "instalador\saida\MesaConsole-$v-instalador.exe" `
                      "instalador\saida\MesaConsole-$v-$($faltas -join '-')-NAO-USAR-NO-AR.exe" -Force
            Write-Host "::warning::Instalador incompleto: $($faltas -join ', ')"
          }

      - name: Anexar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: MesaConsole-${{ steps.versao.outputs.versao }}
          path: instalador/saida/*.exe
          retention-days: 90
