<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — mockup de superfície + Audio Trigger Engine</title>
<style>
  :root{
    --bg:#0b0c0e;
    --surface:#1b1e22;
    --surface-hi:#24282d;
    --surface-lo:#131619;
    --edge:#0a0b0d;
    --hair:#33383e;
    --text:#c9d1d9;
    --text-dim:#6c757e;
    --oled-bg:#04070a;
    --oled:#8fe3ff;
    --oled-dim:#2b6d85;
    --on:#ff3b30;
    --prev:#ffb020;
    --bus:#54d07f;
    --trig:#ff2d78;
    --wide:#5b8cff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{padding:10px;overflow-x:auto}
  .wrap{margin:0 auto}

  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .topbar h1{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin:0}
  .topbar span{font-size:12px;color:var(--text-dim);letter-spacing:.06em}

  /* ---------- chassis ---------- */
  .chassis{
    background:linear-gradient(180deg,#242830 0%,#1a1d21 40%,#15181b 100%);
    border:1px solid var(--edge);border-radius:10px;
    box-shadow:0 22px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    padding:10px;
  }

  /* ---------- meter bridge ---------- */
  .bridge{display:grid;grid-template-columns:1fr 1fr 132px;gap:8px;margin-bottom:8px}
  .oled{background:var(--oled-bg);border:1px solid #000;border-radius:4px;
    box-shadow:inset 0 0 22px rgba(30,140,180,.14), 0 1px 0 rgba(255,255,255,.05);}
  .bridge-meters{padding:8px 11px;display:flex;flex-direction:column;justify-content:center;gap:7px}
  .bmrow{display:grid;grid-template-columns:52px 1fr 50px;align-items:center;gap:9px}
  .bmrow b{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--oled-dim);font-weight:500}
  .bmrow i{font-family:var(--mono);font-size:13px;color:var(--oled);font-style:normal;text-align:right}
  .track{height:14px;background:#0a1116;border-radius:1px;position:relative;overflow:hidden}
  .track .fill{height:100%;width:0%;background:linear-gradient(90deg,#1f8fb0,#8fe3ff 72%,#ffb020 88%,#ff3b30 97%);
    transition:width .05s linear}
  .track .seg{position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 3px,var(--oled-bg) 3px 5px)}
  .scale{display:grid;grid-template-columns:62px 1fr 56px;gap:10px}
  .scale div{display:none;font-family:var(--mono);font-size:10px;color:#215466;display:flex;justify-content:space-between}
  .clockbox{padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;align-items:center}
  .clockbox .t{font-family:var(--mono);font-size:24px;line-height:1;color:var(--oled);letter-spacing:.03em}
  .clockbox .t2{font-family:var(--mono);font-size:15px;line-height:1;color:var(--oled-dim)}
  .clockbox .l{display:none}

  /* ---------- surface ---------- */
  .surface{display:grid;gap:6px}
  .master{min-width:250px}
  .layercol{display:flex;flex-direction:column;gap:6px}
  .layerbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:1px solid var(--edge);border-radius:6px;cursor:pointer;user-select:none;
    background:linear-gradient(180deg,#2c3138,#1c2025);color:#7d868f;
    font-family:var(--mono);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .layerbtn b{font-size:30px;line-height:1;font-weight:600;letter-spacing:.02em}
  .layerbtn span{font-size:9px;letter-spacing:.12em}
  .layerbtn:hover{background:linear-gradient(180deg,#353b43,#22262c)}
  .layerbtn.act{background:linear-gradient(180deg,#2f6f47,#1c4a2d);color:#d8ffe8;border-color:#0d2b1a;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 14px rgba(84,208,127,.3)}

  .strip{background:linear-gradient(180deg,var(--surface-hi),var(--surface) 18%,var(--surface-lo));
    border:1px solid var(--edge);border-radius:6px;padding:7px 6px 9px;display:flex;flex-direction:column;gap:6px}

  .strip-oled{padding:6px 7px;min-height:58px;display:flex;flex-direction:column;gap:4px}
  .strip-oled .src{font-family:var(--mono);font-size:14px;color:var(--oled);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip-oled .sub{font-family:var(--mono);font-size:11px;color:var(--oled-dim);display:flex;justify-content:space-between}
  .strip-oled .cam{font-family:var(--mono);font-size:11px;color:var(--oled-dim);letter-spacing:.06em}

  .knobwrap{display:flex;justify-content:center;padding:2px 0}
  .knob{width:44px;height:44px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;
    background:radial-gradient(circle at 38% 30%,#494f57,#2a2e33 58%,#171a1d 100%);
    border:1px solid #0b0c0e;box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12)}
  .knob::after{content:"";position:absolute;left:50%;top:5px;width:2px;height:14px;margin-left:-1px;
    background:var(--oled);border-radius:1px;transform-origin:50% 16px;box-shadow:0 0 6px rgba(143,227,255,.6)}
  .knoblbl{text-align:center;font-size:10px;letter-spacing:.14em;color:var(--text-dim);text-transform:uppercase}

  .btn{border:1px solid var(--edge);border-radius:3px;background:linear-gradient(180deg,#33383f,#22262a);
    color:#9aa4ae;font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:10px 2px;text-align:center;
    cursor:pointer;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
    display:flex;align-items:center;justify-content:center;line-height:1}
  .btn:hover{background:linear-gradient(180deg,#3b414a,#282d33)}
  .btn:focus-visible{outline:2px solid var(--oled);outline-offset:1px}
  .buses{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .btn.bus.act{background:linear-gradient(180deg,#2f6f47,#1e4a2f);color:#c6f4d8;border-color:#0d2b1a;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 10px rgba(84,208,127,.28)}
  .btn.prev.act{background:linear-gradient(180deg,#8a5c11,#5c3d0b);color:#ffdf9e;box-shadow:0 0 10px rgba(255,176,32,.3)}
  .btn.soft{font-size:12px;color:#c9d1d9;letter-spacing:.1em;color:var(--text-dim)}

  .inmeters{display:flex;flex-direction:column;gap:4px;padding:6px 6px;border-radius:3px;
    background:var(--oled-bg);border:1px solid #000;box-shadow:inset 0 0 14px rgba(30,140,180,.12)}
  .imrow{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:5px}
  .imrow b{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--oled-dim);font-weight:500}
  .imbar{position:relative;height:9px;background:#0a1116;border-radius:1px;overflow:hidden}
  .imbar .f{position:absolute;left:0;top:0;bottom:0;width:0%;
    background:linear-gradient(90deg,#1f8fb0,#8fe3ff 70%,#ffb020 88%,#ff3b30 97%);transition:width .05s linear}
  .imbar .sg{position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 3px,var(--oled-bg) 3px 5px)}
  .imbar .thrmark{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--trig);opacity:.9}
  .faderzone{display:flex;align-items:stretch;justify-content:center;flex:1;min-height:300px}
  .faderzone>.fader{width:70px}
  .fader{position:relative;background:var(--surface-lo);border:1px solid var(--edge);border-radius:3px;
    cursor:ns-resize;touch-action:none;overflow:hidden}
  .fader .slot{position:absolute;left:50%;top:12px;bottom:12px;width:6px;margin-left:-3px;background:#0a0b0d;border-radius:2px;
    box-shadow:inset 0 0 4px #000}
  .fader .ticks{position:absolute;inset:12px 0;display:flex;flex-direction:column;justify-content:space-between;padding:0 5px}
  .fader .ticks span{height:1px;background:#2b3036}
  .fader .cap{position:absolute;left:6px;right:6px;height:36px;border-radius:3px;
    background:linear-gradient(180deg,#5a626c,#31363c 46%,#1d2126);border:1px solid #0a0b0d;
    box-shadow:0 3px 7px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.22)}
  .fader .cap::after{content:"";position:absolute;left:6px;right:6px;top:14px;height:2px;background:#0d0f11;border-radius:1px}
  .fader .scalenums{position:absolute;left:3px;top:12px;bottom:12px;display:flex;
    flex-direction:column;justify-content:space-between;pointer-events:none;
    font-family:var(--mono);font-size:8px;color:#39424b}
  .fdb{font-family:var(--mono);font-size:13px;color:var(--oled);text-align:center;
    background:var(--oled-bg);border:1px solid #000;border-radius:3px;padding:4px 0;
    box-shadow:inset 0 0 14px rgba(30,140,180,.14)}
  .mfaders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-height:130px}
  .mf{display:flex;flex-direction:column;gap:5px;align-items:stretch;min-height:0}
  .mflbl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-dim);text-align:center}
  .mf .fader{flex:1;min-height:110px}
  .mf .cap{height:26px}
  .mfval{font-family:var(--mono);font-size:12px;color:var(--oled);text-align:center}

  .onoff{display:grid;grid-template-columns:1fr;gap:5px}
  .big{border:1px solid var(--edge);border-radius:4px;padding:12px 0;text-align:center;cursor:pointer;user-select:none;
    font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.16em;color:#8d959e;
    background:linear-gradient(180deg,#33383f,#1e2226);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .big.on-act{background:linear-gradient(180deg,#c22b22,#7d160f);color:#ffe3e0;border-color:#3d0704;
    box-shadow:0 0 14px rgba(255,59,48,.4),inset 0 1px 0 rgba(255,255,255,.2)}
  .big.off-act{background:linear-gradient(180deg,#3d434b,#25292e);color:#dfe4ea}

  .trigrow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:3px;
    background:#0e1114;border:1px solid var(--edge)}
  .lamp{width:11px;height:11px;border-radius:50%;background:#2a2f35;flex:none;transition:background .1s,box-shadow .1s}
  .lamp.cand{background:var(--prev);box-shadow:0 0 8px var(--prev)}
  .lamp.act{background:var(--trig);box-shadow:0 0 10px var(--trig)}
  .lamp.cool{background:#3a4552}
  .lamp.sig.ok{background:var(--bus);box-shadow:0 0 8px var(--bus)}
  .lamp.sig.alarm{background:var(--prev);box-shadow:0 0 9px var(--prev)}
  .trigrow span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- master / automation ---------- */
  .master{background:linear-gradient(180deg,var(--surface-hi),var(--surface) 18%,var(--surface-lo));
    border:1px solid var(--edge);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:9px;
    height:100%;overflow:hidden}
  .mtitle{font-size:10px;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;
    border-bottom:1px solid var(--hair);padding-bottom:5px}
  .monsel{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .knobrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:2px 0}
  .knobrow>div{display:flex;flex-direction:column;align-items:center;gap:4px}
  .fcount{font-family:var(--mono);font-size:12px;color:var(--text);
    background:#1b1e22;border:1px solid var(--edge);border-radius:3px;padding:7px 8px}
  .scenebar{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
  .wrap{transform-origin:top left}
  .scenebar select{font-family:var(--mono);font-size:12px;color:var(--oled);
    background:#05070a;border:1px solid var(--edge);border-radius:3px;padding:7px 8px;min-width:190px}
  .sbtn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:#c9d1d9;cursor:pointer;
    background:linear-gradient(180deg,#33383f,#22262a);border:1px solid var(--edge);
    border-radius:3px;padding:8px 12px;user-select:none}
  .sbtn:hover{background:linear-gradient(180deg,#3b414a,#282d33)}
  .sbtn.hot{background:linear-gradient(180deg,#2f6f47,#1e4a2f);color:#c6f4d8}
  .bigknob{width:88px;height:88px;margin:2px auto;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;
    background:radial-gradient(circle at 36% 28%,#525862,#2c3036 58%,#15171a 100%);
    border:1px solid #0a0b0d;box-shadow:0 5px 12px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.14)}
  .bigknob::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:20px;margin-left:-1.5px;
    background:var(--oled);border-radius:2px;transform-origin:50% 32px;box-shadow:0 0 7px rgba(143,227,255,.6)}
  .autopanel{padding:8px;display:flex;flex-direction:column;gap:6px}
  .autoline{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px}
  .autoline b{color:var(--oled-dim);font-weight:500;letter-spacing:.08em}
  .autoline i{color:var(--oled);font-style:normal}
  .live{font-family:var(--mono);font-size:26px;color:var(--wide);letter-spacing:.04em;text-align:center;padding:4px 0}
  .live.hot{color:var(--trig);text-shadow:0 0 12px rgba(255,45,120,.5)}
  .log{height:190px;overflow-y:auto;padding:8px 9px;font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--oled-dim)}
  .log .fire{color:var(--trig)}
  .log .rej{color:#5d6570}
  .log .cut{color:var(--oled)}
  .toggle{display:flex;justify-content:space-between;align-items:center;gap:6px;
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:#9aa4ae;
    border:1px solid var(--edge);border-radius:3px;padding:10px 9px;cursor:pointer;user-select:none;
    background:linear-gradient(180deg,#2c3138,#1e2226)}
  .toggle .pill{font-size:10px;padding:3px 8px;border-radius:2px;background:#12151a;color:#6c757e}
  .toggle.act .pill{background:#2f6f47;color:#c6f4d8}
  .toggle.test.act .pill{background:#8a5c11;color:#ffdf9e}

  /* painel de automação: sai da coluna do master, abre por cima */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:360px;z-index:50;
    background:linear-gradient(180deg,#1e2126,#141619);border-left:1px solid var(--edge);
    box-shadow:-18px 0 40px rgba(0,0,0,.55);padding:16px;overflow-y:auto;
    transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column;gap:9px}
  .drawer.open{transform:none}
  .drawer h2{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text)}
  .drawer .close{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--text-dim);
    font-family:var(--mono);font-size:16px;user-select:none}
  .drawer .log{height:auto;flex:1;min-height:220px}
  .master{overflow:hidden}
  /* painel de configuracoes */
  .cfg{position:fixed;inset:0;z-index:80;background:rgba(6,7,9,.72);display:none;
    align-items:center;justify-content:center;padding:24px}
  .cfg.open{display:flex}
  .cfgwrap{width:min(1080px,96vw);height:min(760px,92vh);display:grid;grid-template-columns:210px 1fr;
    background:linear-gradient(180deg,#20242a,#15181c);border:1px solid var(--edge);border-radius:10px;
    box-shadow:0 30px 70px rgba(0,0,0,.6);overflow:hidden}
  .cfgtabs{background:#15181b;border-right:1px solid var(--edge);padding:14px 0;display:flex;flex-direction:column}
  .cfgtabs h3{margin:0 16px 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim)}
  .cfgtab{padding:12px 16px;font-family:var(--mono);font-size:12px;color:#8d959e;cursor:pointer;
    border-left:3px solid transparent}
  .cfgtab:hover{background:#1c2025;color:var(--text)}
  .cfgtab.act{background:#1c2025;color:var(--oled);border-left-color:var(--oled)}
  .cfgbody{padding:20px 22px;overflow-y:auto}
  .cfgbody h4{margin:0 0 4px;font-size:15px;letter-spacing:.04em;color:var(--text)}
  .cfgbody p.hint{margin:0 0 16px;font-size:12px;color:var(--text-dim);line-height:1.5}
  .cfgrow{display:grid;grid-template-columns:220px 1fr;align-items:center;gap:12px;
    padding:9px 0;border-bottom:1px solid #24282d}
  .cfglbl{font-size:13px;color:#aab3bc}
  .cfg input,.cfg select{font-family:var(--mono);font-size:13px;color:var(--text);
    background:#0e1114;border:1px solid var(--edge);border-radius:4px;padding:8px 9px;width:100%;max-width:280px}
  .cfg input[type=checkbox]{width:20px;height:20px;max-width:20px}
  .cfgnote{margin-top:14px;padding:10px 12px;border-radius:5px;background:#12161a;
    border-left:3px solid var(--oled-dim);font-size:12px;color:var(--text-dim);line-height:1.55}
  .cfgtable{width:100%;border-collapse:collapse;font-size:12px}
  .cfgtable th{text-align:left;font-weight:500;color:var(--text-dim);font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;padding:6px 6px;border-bottom:1px solid #2c3138}
  .cfgtable td{padding:5px 6px;border-bottom:1px solid #20242a}
  .cfgtable input,.cfgtable select{padding:5px 6px;font-size:12px;max-width:none}
  .chpanel{position:fixed;top:0;right:0;bottom:0;width:420px;z-index:75;padding:16px 18px;
    background:linear-gradient(180deg,#20242a,#14171a);border-left:1px solid var(--edge);
    box-shadow:-20px 0 44px rgba(0,0,0,.6);overflow-y:auto;
    transform:translateX(102%);transition:transform .18s ease}
  .chpanel.open{transform:none}
  .chpanel h2{margin:0 0 2px;font-size:17px;color:var(--oled);letter-spacing:.03em}
  .chpanel .sub{margin:0 0 14px;font-size:12px;color:var(--text-dim);font-family:var(--mono)}
  .chsec{margin:16px 0 6px;display:flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);
    border-bottom:1px solid var(--hair);padding-bottom:6px}
  .chsec .lk{font-size:12px;color:var(--prev)}
  .chpanel input,.chpanel select{font-family:var(--mono);font-size:13px;color:var(--text);
    background:#0e1114;border:1px solid var(--edge);border-radius:4px;padding:7px 8px;width:100%;max-width:200px}
  .chpanel input[type=checkbox]{width:20px;height:20px;max-width:20px}
  .chpanel input:disabled,.chpanel select:disabled{opacity:.4;cursor:not-allowed}
  .chrow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;
    padding:7px 0;border-bottom:1px solid #22262b}
  .chrow>div:first-child{font-size:13px;color:#aab3bc}
  .rack{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .dspslot{display:grid;grid-template-columns:22px 1fr 30px 30px;align-items:center;gap:6px;
    background:#161a1e;border:1px solid var(--edge);border-radius:4px;padding:8px 9px;
    font-family:var(--mono);font-size:12px;color:#9aa4ae}
  .dspslot.on{color:#c6f4d8;border-color:#1e4a2f;background:linear-gradient(180deg,#1d2a22,#161a1e)}
  .dspslot .dot{width:9px;height:9px;border-radius:50%;background:#2a2f35}
  .dspslot.on .dot{background:var(--bus);box-shadow:0 0 8px var(--bus)}
  .dspslot .mv{text-align:center;cursor:pointer;border-radius:3px;background:#0f1215;padding:3px 0}
  .dspslot .mv:hover{background:#232830;color:var(--text)}
  .dspslot.fixed{opacity:.75}
  .chclose{float:right;cursor:pointer;color:var(--text-dim);font-family:var(--mono);font-size:18px}
  .cfgclose{position:absolute;top:30px;right:34px;cursor:pointer;color:var(--text-dim);
    font-family:var(--mono);font-size:20px;user-select:none;z-index:81}
  .menubtn{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:#c9d1d9;cursor:pointer;
    background:linear-gradient(180deg,#33383f,#22262a);border:1px solid var(--edge);
    border-radius:4px;padding:8px 14px;user-select:none;margin-left:auto}
  .menubtn:hover{background:linear-gradient(180deg,#3b414a,#282d33)}
  .menu{position:fixed;top:14px;right:14px;z-index:70;width:330px;padding:14px;display:none;
    background:linear-gradient(180deg,#22262c,#15181c);border:1px solid var(--edge);border-radius:8px;
    box-shadow:0 22px 50px rgba(0,0,0,.6)}
  .menu.open{display:block}
  .menu .scenebar{flex-direction:column;align-items:stretch;margin-left:0;gap:7px}
  .menu .sbtn{text-align:center;padding:10px 12px}
  .menu select{width:100%}
  .menu h3{margin:0 0 10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim)}
  .footnote{position:absolute;left:-9999px}
  .footnote-off{margin-top:12px;font-size:13px;color:var(--text-dim);line-height:1.6;max-width:900px}
  .footnote code{font-family:var(--mono);color:#93a0ad}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <h1>Superfície</h1>
    <span id="zinfo" style="font-family:var(--mono)"></span>
  </div>

  <div class="chassis">
    <!-- METER BRIDGE -->
    <div class="bridge">
      <div class="oled bridge-meters" id="bridgeA"></div>
      <div class="oled bridge-meters" id="bridgeB"></div>
      <div class="oled clockbox">
        <div class="t" id="clock">--:--:--</div>
        <div class="t2" id="timer">00:00</div>
      </div>
    </div>

    <!-- SURFACE -->
    <div class="surface" id="surface"></div>
  </div>

  <p class="footnote">
    Arraste faders e encoders. <code>AUTOMAÇÃO</code> abre o painel com parâmetros do trigger e log.
  </p>
</div>

<script>
(function(){
  "use strict";

  // ---------- modelo ----------
  var SOURCES = ["MIC 1 · APRES","MIC 2 · CONV","MIC 3 · CONV","MIC 4 · PLATEIA",
                 "PLAYOUT A","PLAYOUT B","TEL · VX 1","REMOTA IP"];
  var TRIG_CH = 4;      // canais 1-4 com automação de câmera
  var LAYERS  = 2;      // layer A = canais 1-8, layer B = 9-16
  var layer   = 0;
  var MODES   = ["ESTÉREO","ESQ","DIR","SOMA"];

  var P = { threshold:-35, hysteresis:5, triggerTime:150, hold:800, release:400,
            cooldown:500, minShot:1200, dominance:6, wideCam:5 };

  var chans = [], bridgeMeters = [];

  function makeChans(n){
   chans=[];
   for (var i=0;i<n;i++){
    chans.push({
      id:i+1, src:SOURCES[i%SOURCES.length], srcIdx:i%SOURCES.length,
      cam: i<TRIG_CH ? i+1 : 0,
      fader: i<4 ? .78 : .62, on: i<3, prev:false,
      buses:{1:i<4, 2:false, 3:false, 4:false},
      trim:0, pan:0, mode:0, param:0, netIdx:-1, type:5,
      dsp:[{n:"Auto Trim",on:false,fixed:true},{n:"EQ paramétrico",on:true},
           {n:"Compressor",on:false},{n:"Gate / Expander",on:false},
           {n:"De-esser",on:false},{n:"Limiter",on:false}],
      level:-70, peak:-70,
      speaking:false, nextFlip: 800+Math.random()*2500,
      st:"IDLE", tState:0, belowT:0,
      cmd:"", cmdRelease:"", cmdTarget:0,
      logic:false, logicTarget:1, onCmd:"", offCmd:"",
      presence:{silence:1e9, ever:false, peak:-100},
      cal:{running:false, elapsed:0, floor:0, speech:-100, first:true}
    });
   }
  }

  var auto = { enabled:true, test:false, dominance:true,
               live:P.wideCam, lastCut:-9999, holdUntil:0, t:0 };
  var log = [];

  // ---------- helpers ----------
  function el(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls;
    if(html!=null)e.innerHTML=html; return e; }
  function dbToPct(db){ return Math.max(0,Math.min(100,(db+60)/60*100)); }
  function faderDb(v){ return v<=0 ? -Infinity : -60 + v*70; } // topo = +10
  function fmt(db){ return db<=-59.5 ? "-∞" : (db>0?"+":"")+db.toFixed(1); }
  function now(){ return auto.t; }

  function addLog(cls,txt){
    var d=new Date(), ts=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+
      ":"+("0"+d.getSeconds()).slice(-2)+"."+("00"+d.getMilliseconds()).slice(-3);
    log.unshift({cls:cls,txt:ts+"  "+txt});
    if(log.length>60) log.pop();
    var box=document.getElementById("log");
    if(box) box.innerHTML = log.map(function(l){return '<div class="'+l.cls+'">'+l.txt+'</div>';}).join("");
  }

  // ---------- construção da superfície ----------
  var surface=document.getElementById("surface");

  function buildStrips(){
   chans.forEach(function(c){ c.ui=null; });
   chans.slice(layer*faderCount,(layer+1)*faderCount).forEach(function(c,idx){
    var strip=el("div","strip");

    var oled=el("div","oled strip-oled");
    var src=el("div","src",c.src);
    var sub=el("div","sub",'<span class="pname">TRIM</span><span class="trimv">0.0</span>');
    var cam=el("div","cam", c.cam ? "CAM "+c.cam+" · AUTO" : "SEM AUTOMAÇÃO");
    oled.appendChild(src); oled.appendChild(sub); oled.appendChild(cam);
    strip.appendChild(oled);

    var soft=el("div","btn soft","SOFT \u22EF");
    soft.setAttribute("tabindex","0");
    soft.addEventListener("click",function(){ openChannel(c); });
    strip.appendChild(soft);

    var buses=el("div","buses");
    var busBtns={};
    [1,2,3,4].forEach(function(b){
      var bb=el("div","btn bus"+(c.buses[b]?" act":""),"PGM "+b);
      bb.setAttribute("tabindex","0");
      bb.addEventListener("click",function(){ c.buses[b]=!c.buses[b]; bb.classList.toggle("act",c.buses[b]); });
      buses.appendChild(bb); busBtns[b]=bb;
    });
    strip.appendChild(buses);

    var prev=el("div","btn prev","PREV"); prev.setAttribute("tabindex","0");
    prev.addEventListener("click",function(){ c.prev=!c.prev; prev.classList.toggle("act",c.prev); });
    strip.appendChild(prev);

    // modulação de entrada (o que o trigger enxerga) e pós-trim
    var im=el("div","inmeters");
    function imrow(lbl,withThr){
      var r=el("div","imrow"); r.appendChild(el("b","",lbl));
      var bar=el("div","imbar"), f=el("div","f"), sg=el("div","sg");
      bar.appendChild(f); bar.appendChild(sg);
      var mark=null;
      if(withThr){ mark=el("div","thrmark"); bar.appendChild(mark); }
      r.appendChild(bar); im.appendChild(r);
      return {f:f,mark:mark};
    }
    var mIn   = imrow("IN",true);
    var mTrim = imrow("TRIM",false);
    strip.appendChild(im);

    var fz=el("div","faderzone");
    var fader=el("div","fader");
    var slot=el("div","slot"); var ticks=el("div","ticks");
    for(var t=0;t<8;t++) ticks.appendChild(el("span"));
    var nums=el("div","scalenums");
    ["+10","0","-10","-20","-30","-40","-50","-∞"].forEach(function(v){
      nums.appendChild(el("span","",v));
    });
    fader.appendChild(nums);
    var cap=el("div","cap");
    fader.appendChild(slot); fader.appendChild(ticks); fader.appendChild(cap);
    fz.appendChild(fader);
    strip.appendChild(fz);

    var fdb=el("div","fdb","-∞");
    strip.appendChild(fdb);

    var onoff=el("div","onoff");
    var bOn=el("div","big"+(c.on?" on-act":""),"ON");
    var bOff=el("div","big"+(!c.on?" off-act":""),"OFF");
    bOn.setAttribute("tabindex","0"); bOff.setAttribute("tabindex","0");
    function setOn(v){ c.on=v; bOn.classList.toggle("on-act",v); bOff.classList.toggle("off-act",!v); }

    /** Apertar ON/OFF manda o comando SEMPRE — inclusive com o canal já naquele
        estado. Relançar o cartucho é ação explícita do operador, não repetição
        de estado; a detecção por borda continua valendo para o resto. */
    function pressLogic(on){
      var repetido = (c.on===on);
      setOn(on);
      if(!c.logic) return;
      var txt = on ? c.onCmd : c.offCmd;
      if(!txt) return;
      c._prevOn = on;                       // evita a borda disparar de novo
      sendReal(c.logicTarget, txt, "CH0"+c.id+(repetido?"  [reenvio]  ":"  "));
    }
    bOn .addEventListener("click",function(){ pressLogic(true);  });
    bOff.addEventListener("click",function(){ pressLogic(false); });
    onoff.appendChild(bOn); onoff.appendChild(bOff);   // ON em cima, OFF embaixo
    strip.appendChild(onoff);

    var tr=el("div","trigrow");
    var siglamp=el("div","lamp sig"); siglamp.title="sinal na entrada";
    var lamp=el("div","lamp"); var tlbl=el("span","","IDLE");
    tr.appendChild(siglamp); tr.appendChild(lamp); tr.appendChild(tlbl);
    strip.appendChild(tr);

    surface.appendChild(strip);

    // fader drag
    function faderFromEvent(ev){
      var r=fader.getBoundingClientRect();
      var y=(ev.clientY!=null?ev.clientY:ev.touches[0].clientY)-r.top;
      c.fader=Math.max(0,Math.min(1,1-(y-18)/(r.height-36)));
    }
    fader.addEventListener("pointerdown",function(ev){
      fader.setPointerCapture(ev.pointerId); faderFromEvent(ev);
      fader.onpointermove=function(e){ faderFromEvent(e); };
      fader.onpointerup=function(){ fader.onpointermove=null; };
    });

    c.ui={cap:cap,lamp:lamp,siglamp:siglamp,tlbl:tlbl,fdb:fdb,mIn:mIn,mTrim:mTrim,
          trimv:sub.querySelector(".trimv"),pname:sub.querySelector(".pname"),cam:cam};
   });
  }

  // ---------- master ----------
  var master=el("div","master");
  master.appendChild(el("div","mtitle","monitor · controle"));
  var crDisp=el("div","oled autopanel");
  crDisp.innerHTML='<div class="autoline"><b>MONITOR CR</b><i id="crsrc">PGM 1</i></div>'+
                   '<div class="autoline"><b>ESTÚDIO</b><i id="stsrc">PGM 1</i></div>';
  master.appendChild(crDisp);

  function group(labels,cols,onPick,actIdx){
    var g=el("div","monsel"); g.style.gridTemplateColumns="repeat("+cols+",1fr)";
    labels.forEach(function(n,i){
      var b=el("div","btn bus"+(i===actIdx?" act":""),n); b.setAttribute("tabindex","0");
      b.addEventListener("click",function(){
        g.querySelectorAll(".btn").forEach(function(x){x.classList.remove("act");});
        b.classList.add("act"); if(onPick) onPick(n);
      });
      g.appendChild(b);
    });
    return g;
  }
  master.appendChild(group(["PGM 1","PGM 2","PGM 3","PGM 4","EXT 1","EXT 2"],3,function(n){
    document.getElementById("crsrc").textContent=n;
  },0));

  // faders pequenos no lugar dos knobs: encoder rotativo e ruim em tela de toque
  function miniFader(label, init){
    var col=el("div","mf"), st={v:init};
    col.appendChild(el("div","mflbl",label));

    var f=el("div","fader"), slot=el("div","slot"), ticks=el("div","ticks");
    for(var t=0;t<6;t++) ticks.appendChild(el("span"));
    var cap=el("div","cap");
    f.appendChild(slot); f.appendChild(ticks); f.appendChild(cap);
    col.appendChild(f);

    var val=el("div","mfval","");
    col.appendChild(val);

    function paint(){
      cap.style.bottom="calc("+(st.v*100)+"% - "+(st.v*26)+"px + 12px)";
      val.textContent = st.v<=0.01 ? "-∞" : (-60+st.v*60).toFixed(0)+" dB";
    }
    function fromEvent(ev){
      var r=f.getBoundingClientRect();
      st.v=Math.max(0,Math.min(1,1-((ev.clientY-r.top)-13)/(r.height-26)));
      paint();
    }
    f.addEventListener("pointerdown",function(ev){
      f.setPointerCapture(ev.pointerId); fromEvent(ev);
      f.onpointermove=function(e){ fromEvent(e); };
      f.onpointerup=function(){ f.onpointermove=null; };
    });
    paint();
    return col;
  }

  var mf=el("div","mfaders");
  mf.appendChild(miniFader("MONITOR",.72));
  mf.appendChild(miniFader("FONE",.66));
  mf.appendChild(miniFader("CUE",.58));
  master.appendChild(mf);

  var keys=el("div","monsel"); keys.style.gridTemplateColumns="repeat(3,1fr)";
  ["TALK BF","TALK EST","REC","PERFIL","METER","RELÓGIO"].forEach(function(n){
    var b=el("div","btn",n); b.setAttribute("tabindex","0");
    b.addEventListener("click",function(){ b.classList.toggle("act"); b.classList.toggle("bus"); });
    keys.appendChild(b);
  });
  master.appendChild(keys);

  master.appendChild(el("div","mtitle","estúdio · timer"));
  master.appendChild(group(["PGM 1","PGM 2","PGM 3","EXT 1"],4,function(n){
    document.getElementById("stsrc").textContent=n;
  },0));
  var trow=el("div","monsel"); trow.style.gridTemplateColumns="repeat(2,1fr)";
  ["RESET","RUN/STOP"].forEach(function(n){
    var b=el("div","btn",n); b.setAttribute("tabindex","0");
    b.addEventListener("click",function(){
      if(n==="RESET") timer0=performance.now();
      else { b.classList.toggle("act"); b.classList.toggle("bus"); }
    });
    trow.appendChild(b);
  });
  master.appendChild(trow);

  master.appendChild(el("div","mtitle","automação de câmeras"));
  var live=el("div","oled live","CAM "+P.wideCam);
  master.appendChild(live);

  var drawer=el("div","drawer");
  drawer.appendChild(el("div","close","\u2715")).addEventListener("click",function(){
    drawer.classList.remove("open");
  });
  drawer.appendChild(el("h2","","Automação de câmeras"));
  document.body.appendChild(drawer);

  var openBtn=el("div","btn","AUTOMAÇÃO \u22EF"); openBtn.setAttribute("tabindex","0");
  openBtn.addEventListener("click",function(){ drawer.classList.toggle("open"); });
  master.appendChild(openBtn);

  var tg1=el("div","toggle act",'<span>AUTOMAÇÃO GERAL</span><span class="pill">ON</span>');
  var tg2=el("div","toggle test",'<span>MODO DE TESTE</span><span class="pill">OFF</span>');
  var tg3=el("div","toggle act",'<span>DOMINÂNCIA</span><span class="pill">ON</span>');
  tg1.setAttribute("tabindex","0"); tg2.setAttribute("tabindex","0"); tg3.setAttribute("tabindex","0");
  tg1.addEventListener("click",function(){ auto.enabled=!auto.enabled;
    tg1.classList.toggle("act",auto.enabled); tg1.querySelector(".pill").textContent=auto.enabled?"ON":"OFF";
    addLog("cut","AUTOMAÇÃO GERAL "+(auto.enabled?"HABILITADA":"DESABILITADA")); });
  tg2.addEventListener("click",function(){ auto.test=!auto.test;
    tg2.classList.toggle("act",auto.test); tg2.querySelector(".pill").textContent=auto.test?"ON":"OFF";
    addLog("cut","MODO DE TESTE "+(auto.test?"ON — nada é enviado ao vMix":"OFF")); });
  tg3.addEventListener("click",function(){ auto.dominance=!auto.dominance;
    tg3.classList.toggle("act",auto.dominance); tg3.querySelector(".pill").textContent=auto.dominance?"ON":"OFF";
    addLog("cut","REGRA DE DOMINÂNCIA "+(auto.dominance?"ON":"OFF — vazamento vai disparar canais errados")); });
  drawer.appendChild(tg1); drawer.appendChild(tg2); drawer.appendChild(tg3);

  var ap=el("div","oled autopanel");   // painel de parametros, redesenhado ao trocar de cena
  ap.innerHTML =
    '<div class="autoline"><b>THRESHOLD</b><i>'+P.threshold+' dBFS</i></div>'+
    '<div class="autoline"><b>TRIGGER TIME</b><i>'+P.triggerTime+' ms</i></div>'+
    '<div class="autoline"><b>HISTERESE</b><i>'+P.hysteresis+' dB</i></div>'+
    '<div class="autoline"><b>HOLD</b><i>'+P.hold+' ms</i></div>'+
    '<div class="autoline"><b>RELEASE</b><i>'+P.release+' ms</i></div>'+
    '<div class="autoline"><b>COOLDOWN</b><i>'+P.cooldown+' ms</i></div>'+
    '<div class="autoline"><b>PLANO MÍN.</b><i>'+P.minShot+' ms</i></div>'+
    '<div class="autoline"><b>CÂM. GERAL</b><i>CAM '+P.wideCam+'</i></div>';
  drawer.appendChild(el("div","mtitle","parâmetros do trigger"));
  drawer.appendChild(ap);

  drawer.appendChild(el("div","mtitle","envio de comandos"));
  var sendBox=el("div","oled autopanel"); sendBox.id="sendbox";
  drawer.appendChild(sendBox);

  drawer.appendChild(el("div","mtitle","testes"));
  var sweep=el("div","toggle");
  sweep.innerHTML='<span>TESTAR TODAS AS CÂMERAS</span><span class="pill">IR</span>';
  sweep.setAttribute("tabindex","0");
  sweep.addEventListener("click",function(){
    var cams=chans.filter(function(c){ return c.cam>0; })
                  .map(function(c){ return c.cam; })
                  .filter(function(v,i,a){ return a.indexOf(v)===i; });
    if(!cams.length){ addLog("rej","nenhuma câmera mapeada"); return; }
    cams.forEach(function(cam,i){
      setTimeout(function(){
        if(auto.test) addLog("fire","[VARREDURA] ENVIARIA: CUT → CAM "+cam);
        else { auto.live=cam; addLog("fire","[VARREDURA] CUT → CAM "+cam); }
      }, i*900);
    });
  });
  drawer.appendChild(sweep);

  drawer.appendChild(el("div","mtitle","log de automação"));
  var logbox=el("div","oled log"); logbox.id="log"; drawer.appendChild(logbox);

  var zoomMode="auto", faderCount=8;

  /** Ajusta a mesa ao tamanho da janela: em monitor grande ela cresce em vez de
      ficar espremida num canto; em tela pequena ela encolhe em vez de rolar. */
  function applyZoom(){
    var wrap=document.querySelector(".wrap");
    var need=faderCount*100+350;

    // mede a altura natural em escala 1 antes de decidir o zoom
    wrap.style.minWidth=need+"px";
    wrap.style.zoom=1; wrap.style.transform="";
    var natH=Math.max(1, wrap.scrollHeight);

    var z;
    if(zoomMode==="auto"){
      var byW=(window.innerWidth -40)/need;
      var byH=(window.innerHeight-40)/natH;
      z=Math.max(0.78, Math.min(2.6, Math.min(byW,byH)));   // cabe inteira; abaixo de 78% prefere rolar
    } else if(zoomMode==="width"){
      z=Math.max(0.45, Math.min(2.6, (window.innerWidth-40)/need));
    } else {
      z=parseFloat(zoomMode);
    }

    if("zoom" in document.body.style){ wrap.style.zoom=z; }
    else { wrap.style.transform="scale("+z+")"; document.body.style.height=(natH*z+40)+"px"; }
    document.getElementById("zinfo").textContent=
      Math.round(z*100)+"%  ·  "+window.innerWidth+"x"+window.innerHeight;
  }
  window.addEventListener("resize",applyZoom);

  function build(n){
    faderCount=n;
    if(chans.length!==n*LAYERS) makeChans(n*LAYERS);
    if(layer>=LAYERS) layer=0;
    while(surface.firstChild) surface.removeChild(surface.firstChild);
    surface.appendChild(layerCol);
    buildStrips();
    surface.style.gridTemplateColumns="64px repeat("+n+",minmax(92px,1fr)) 250px";
    surface.appendChild(master);
    syncLayerBtns();
    applyZoom();
  }

  var sel=document.createElement("select"); sel.className="fcount";
  [8,12,16].forEach(function(n){
    var o=document.createElement("option"); o.value=n; o.textContent=n+" faders/layer";
    sel.appendChild(o);
  });
  sel.value="8";
  sel.addEventListener("change",function(){ build(parseInt(sel.value,10)); });

  // ---------- cenas (show profiles) ----------
  var scenes = {}, currentScene = "PADRÃO";

  function captureScene(name){
    return {
      format:1, name:name,
      automation:{ enabled:auto.enabled, testMode:auto.test, dominance:auto.dominance,
                   dominanceDb:P.dominance, minShotMs:P.minShot, wideCamera:P.wideCam },
      trigger:{ thresholdDb:P.threshold, triggerMs:P.triggerTime, holdMs:P.hold,
                releaseMs:P.release, cooldownMs:P.cooldown, hysteresisDb:P.hysteresis },
      channels: chans.map(function(c){
        return { name:c.src, srcIdx:c.srcIdx, faderDb:+(faderDb(c.fader)).toFixed(2),
                 fader:+c.fader.toFixed(4), trimDb:+c.trim.toFixed(2), pan:+c.pan.toFixed(2),
                 mode:c.mode, on:c.on, cue:c.prev, cmd:c.cmd, cmdRelease:c.cmdRelease,
                 buses:[c.buses[1],c.buses[2],c.buses[3],c.buses[4]], camera:c.cam };
      })
    };
  }

  function applyScene(sc){
    if(!sc || !sc.channels) return;
    if(sc.channels.length !== chans.length) makeChans(sc.channels.length);
    var pend=0;
    sc.channels.forEach(function(cs,i){
      var c=chans[i];
      if(c.on && (cs.name!==c.src || !cs.on)){ pend++; return; }   // não derruba o que está no ar
      c.src=cs.name; c.srcIdx=(cs.srcIdx||0)%SOURCES.length;
      c.fader=cs.fader; c.trim=cs.trimDb; c.pan=cs.pan; c.mode=cs.mode||0;
      c.on=cs.on; c.prev=cs.cue; c.cam=cs.camera;
      c.cmd=cs.cmd||""; c.cmdRelease=cs.cmdRelease||"";
      c.buses={1:cs.buses[0],2:cs.buses[1],3:cs.buses[2],4:cs.buses[3]};
    });
    if(sc.trigger){ P.threshold=sc.trigger.thresholdDb; P.triggerTime=sc.trigger.triggerMs;
      P.hold=sc.trigger.holdMs; P.release=sc.trigger.releaseMs;
      P.cooldown=sc.trigger.cooldownMs; P.hysteresis=sc.trigger.hysteresisDb; }
    if(sc.automation){ auto.enabled=sc.automation.enabled; auto.test=sc.automation.testMode;
      auto.dominance=sc.automation.dominance; P.dominance=sc.automation.dominanceDb;
      P.minShot=sc.automation.minShotMs; P.wideCam=sc.automation.wideCamera; }
    build(Math.max(1, Math.round(chans.length/LAYERS)));
    syncToggles(); refreshAutoPanel();
    currentScene=sc.name;
    addLog("cut","CENA CARREGADA · "+sc.name+(pend?"   ("+pend+" canal(is) pendente(s), no ar)":""));
  }

  function syncToggles(){
    tg1.classList.toggle("act",auto.enabled); tg1.querySelector(".pill").textContent=auto.enabled?"ON":"OFF";
    tg2.classList.toggle("act",auto.test);    tg2.querySelector(".pill").textContent=auto.test?"ON":"OFF";
    tg3.classList.toggle("act",auto.dominance);tg3.querySelector(".pill").textContent=auto.dominance?"ON":"OFF";
  }
  function refreshAutoPanel(){
    ap.innerHTML =
      '<div class="autoline"><b>THRESHOLD</b><i>'+P.threshold+' dBFS</i></div>'+
      '<div class="autoline"><b>TRIGGER TIME</b><i>'+P.triggerTime+' ms</i></div>'+
      '<div class="autoline"><b>HISTERESE</b><i>'+P.hysteresis+' dB</i></div>'+
      '<div class="autoline"><b>HOLD</b><i>'+P.hold+' ms</i></div>'+
      '<div class="autoline"><b>RELEASE</b><i>'+P.release+' ms</i></div>'+
      '<div class="autoline"><b>COOLDOWN</b><i>'+P.cooldown+' ms</i></div>'+
      '<div class="autoline"><b>PLANO MÍN.</b><i>'+P.minShot+' ms</i></div>'+
      '<div class="autoline"><b>CÂM. GERAL</b><i>CAM '+P.wideCam+'</i></div>';
  }

  // barra de cenas
  var layerCol=el("div","layercol"), layerBtns=[];
  ["A","B"].forEach(function(name,i){
    var b=el("div","layerbtn"+(i===0?" act":""),
             "<b>"+name+"</b><span>LAYER</span><span class='rng'></span>");
    b.setAttribute("tabindex","0");
    b.addEventListener("click",function(){

    var sinal = p.silence<200 ? "<b style='color:#54d07f'>presente</b>"
              : (p.ever && p.silence>3000 ? "<b style='color:#ffb020'>emudeceu há "
                 +(p.silence/1000).toFixed(1)+" s</b>"
                 : (p.ever?"em silêncio":"<b style='color:#ff6b6b'>nunca houve sinal</b>"));
    var linhaCal = cl.running
      ? "medindo há "+(cl.elapsed/1000).toFixed(1)+" s · ruído "+cl.floor.toFixed(1)
        +" · fala "+cl.speech.toFixed(1)+" dB"
        +(calReady(c)? " → sugerido <b style='color:#8fe3ff'>"+calSuggestion(c).toFixed(1)+" dBFS</b>"
                     : " → ainda sem material")
      : (cl.elapsed>0 ? "ruído "+cl.floor.toFixed(1)+" · fala "+cl.speech.toFixed(1)
         +(calReady(c)? " → sugerido <b style='color:#8fe3ff'>"+calSuggestion(c).toFixed(1)+" dBFS</b>":" → incompleta")
         : "não calibrado");
    calUI.diag.innerHTML =
      "<b>1 · comando</b> — dispara sem áudio e confirma que o vMix responde<br>"+
      "<b>2 · sinal na entrada</b> — "+sinal+" · pico "+p.peak.toFixed(1)+" dBFS<br>"+
      "<b>3 · calibração</b> — "+linhaCal+"<br>"+

  }

  function sendReal(targetIdx, text, tag){
    var t=TARGETS[targetIdx]||TARGETS[0];
    var rotulo=(tag||"")+t.proto+" "+t.host+":"+t.port+"  \u2192  "+text;
    if(!RELAY.enabled){ addLog("fire",rotulo+"   (simulado)"); return; }
    var q=RELAY.url+"?proto="+t.proto.toLowerCase()+"&host="+encodeURIComponent(t.host)+
          "&port="+t.port+"&nl="+(t.nl?1:0)+"&text="+encodeURIComponent(text);
    addLog("fire",rotulo);
    RELAY.pending++;
    fetch(q).then(function(r){ return r.json(); }).then(function(j){
      RELAY.pending--; if(j.ok) RELAY.sent++; else RELAY.failed++;
      if(!j.ok) addLog("rej","   ponte: "+(j.info||"falhou"));
    }).catch(function(){
      RELAY.pending--; RELAY.failed++;
      addLog("rej","   ponte nao respondeu \u2014 o relay.py esta rodando?");
    });
  }

  // ---------- simulação de áudio ----------
  function simulate(dt){
    var anySpeaking=false;
    chans.forEach(function(c){
      c.nextFlip-=dt;
      if(c.nextFlip<=0){
        if(c.id<=TRIG_CH){ c.speaking=!c.speaking;
          c.nextFlip = c.speaking ? 900+Math.random()*2600 : 600+Math.random()*3200; }
        else { c.speaking=false; c.nextFlip=2000; }
      }
      if(c.speaking) anySpeaking=true;
    });
    chans.forEach(function(c){
      var target;
      if(c.id>TRIG_CH){ target = c.on ? -24+Math.random()*6 : -70; }
      else if(c.speaking){ target = -26 + Math.random()*11; }
      else if(anySpeaking){ target = -44 + Math.random()*7; }   // vazamento entre microfones
      else { target = -60 + Math.random()*5; }
      var k = target>c.level ? 0.45 : 0.16;                     // balística: ataque rápido, release lento
      c.level += (target-c.level)*k;
      c.peak = Math.max(c.level, c.peak-dt*0.05);
    });
  }

  function dominant(c){
    if(!auto.dominance) return true;
    for(var i=0;i<TRIG_CH;i++){
      var o=chans[i]; if(o===c) continue;
      if(o.level > c.level - P.dominance && o.level > P.threshold) {
        if(o.level > c.level) return false;
      }
    }
    return true;
  }

  function requestCut(c){
    if(!auto.enabled) { addLog("rej","CH0"+c.id+"  trigger ignorado · automação geral OFF"); return; }
    if(now()-auto.lastCut < P.minShot){
      addLog("rej","CH0"+c.id+"  corte ignorado · plano mínimo ("+Math.round(now()-auto.lastCut)+
        "ms de "+P.minShot+"ms)"); return;
    }
    auto.lastCut=now(); auto.holdUntil=now()+P.hold;
    if(auto.test){ addLog("fire","CH0"+c.id+"  [TESTE] ENVIARIA → "+cmdOf(c)); return; }
    auto.live=c.cam;
    addLog("cut","CH0"+c.id+"  "+cmdOf(c)+"   nível "+c.level.toFixed(1)+" dBFS");
  }

  function triggerFSM(c,dt){
    if(c.id>TRIG_CH) return;
    var thrOn=P.threshold, thrOff=P.threshold-P.hysteresis;
    switch(c.st){
      case "IDLE":
        if(c.level>thrOn && dominant(c)){ c.st="CANDIDATE"; c.tState=0; }
        break;
      case "CANDIDATE":
        c.tState+=dt;
        if(c.level<thrOn){
          addLog("rej","CH0"+c.id+"  descartado · "+Math.round(c.tState)+"ms de "+P.triggerTime+"ms exigidos");
          c.st="IDLE"; c.tState=0;
        } else if(c.tState>=P.triggerTime){
          addLog("fire","CH0"+c.id+"  TRIGGER FIRED  ("+c.level.toFixed(1)+" dBFS)");
          requestCut(c); c.st="ACTIVE"; c.belowT=0;
        }
        break;
      case "ACTIVE":
        if(c.level<thrOff){
          c.belowT+=dt;
          if(c.belowT>=P.release){
            c.st="COOLDOWN"; c.tState=P.cooldown;
            if(c.cmdRelease && auto.enabled && !auto.test)
              sendReal(c.cmdTarget, c.cmdRelease, "CH0"+c.id+"  [soltou]  ");
          }
        }
        else c.belowT=0;
        break;
      case "COOLDOWN":
        c.tState-=dt; if(c.tState<=0){ c.st="IDLE"; c.tState=0; }
        break;
    }
  }

  function fallbackWide(){
    if(!auto.enabled||auto.test) return;
    var active=false;
    for(var i=0;i<TRIG_CH;i++) if(chans[i].st==="ACTIVE"||chans[i].st==="CANDIDATE") active=true;
    if(!active && now()>auto.holdUntil && auto.live!==P.wideCam && now()-auto.lastCut>=P.minShot){
      auto.live=P.wideCam; auto.lastCut=now();
      sendReal(0, "FUNCTION Cut Input="+P.wideCam, "—  [geral, ninguém falando]  ");
    }
  }

  // ---------- render ----------
  var last=performance.now(), timer0=performance.now();
  function frame(t){
    var dt=Math.min(60,t-last); last=t; auto.t+=dt;
    simulate(dt);
    chans.forEach(function(c){
      triggerFSM(c,dt);

      // presença de sinal: não depende do trigger nem do fader
      var p=c.presence;
      if(c.level > -50){ p.silence=0; p.ever=true; } else { p.silence+=dt; }
      if(c.level > p.peak) p.peak=c.level;

      // calibrador: piso de ruído desce rápido e sobe devagar; fala, o contrário
      var cl=c.cal;
      if(cl.running){
        cl.elapsed+=dt;
        if(cl.first){ cl.floor=c.level; cl.speech=c.level; cl.first=false; }
        if(c.level<cl.floor) cl.floor=c.level; else cl.floor += 0.00002*dt*(c.level-cl.floor);
        if(c.level>cl.speech) cl.speech=c.level; else cl.speech += 0.00001*dt*(c.level-cl.speech);
      }
    });
    fallbackWide();

    var busSum={1:-70,2:-70,3:-70,4:-70};
    chans.forEach(function(c){
      // fader-start: comando só na borda
      var openNow = c.on && !c.muted;
      if(c.logic && openNow!==c._prevOn){
        c._prevOn=openNow;
        var txt = openNow ? c.onCmd : c.offCmd;
        if(txt) sendReal(c.logicTarget, txt, "CH0"+c.id+"  ");
      } else if(c._prevOn===undefined){ c._prevOn=openNow; }

      var post = c.on ? c.level + c.trim + Math.min(10,faderDb(c.fader)) : -70;
      for(var b=1;b<=4;b++) if(c.buses[b] && c.on) busSum[b]=Math.max(busSum[b],post);

      var r=c.ui;
      if(!r) return;                       // canal do outro layer: continua no mix, sem strip
      r.cap.style.bottom = "calc("+(c.fader*100)+"% - "+(c.fader*36)+"px + 12px)";
      r.fdb.textContent = c.fader<=0.005 ? "-∞" : (faderDb(c.fader)>=0?"+":"")+faderDb(c.fader).toFixed(1);
      r.mIn.f.style.width   = dbToPct(c.level)+"%";              // pré-trim: fonte do trigger
      r.mTrim.f.style.width = dbToPct(c.level + c.trim)+"%";     // pós-trim, antes do fader
      r.mIn.mark.style.left = dbToPct(P.threshold)+"%";
      r.pname.textContent = "TRIM " + (c.trim>=0?"+":"") + c.trim.toFixed(1);
      r.trimv.textContent = c.pan===0 ? "C" : (c.pan<0?"E":"D") + Math.abs(Math.round(c.pan));
      r.lamp.className="lamp"+(c.st==="CANDIDATE"?" cand":c.st==="ACTIVE"?" act":c.st==="COOLDOWN"?" cool":"");
      r.siglamp.className="lamp sig"+(c.presence.silence<200?" ok":
        (c.presence.ever && c.presence.silence>3000?" alarm":""));
      r.tlbl.textContent = c.id>TRIG_CH ? "—" : c.st+(c.st==="CANDIDATE"?" "+Math.round(c.tState)+"ms":"");
      if(c.cam) r.cam.textContent="CAM "+c.cam+" · "+(auto.enabled?"AUTO":"MANUAL");
    });

    bridgeMeters.forEach(function(m,i){
      var v=busSum[i+1];
      m.fill.style.width=dbToPct(v)+"%";
      m.val.textContent=fmt(v);
    });

    updateDiag();
    sendBox.innerHTML =
      '<div class="autoline"><b>PONTE</b><i>'+(RELAY.enabled?"ligada":"desligada (simulando)")+'</i></div>'+
      '<div class="autoline"><b>ENVIADOS</b><i>'+RELAY.sent+'</i></div>'+
      '<div class="autoline"><b>FALHAS</b><i>'+RELAY.failed+'</i></div>'+
      '<div class="autoline"><b>NA FILA</b><i>'+RELAY.pending+'</i></div>';
    live.textContent="CAM "+auto.live;
    live.className="oled live"+(auto.live!==P.wideCam?" hot":"");

    var d=new Date();
    document.getElementById("clock").textContent=
      ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
    var el2=Math.floor((t-timer0)/1000);
    document.getElementById("timer").textContent=
      ("0"+Math.floor(el2/60)).slice(-2)+":"+("0"+(el2%60)).slice(-2);

    requestAnimationFrame(frame);
  }
  addLog("cut","engine iniciado · 8 canais · trigger ativo em CH01–CH0"+TRIG_CH);
  requestAnimationFrame(frame);


})();
</script>
